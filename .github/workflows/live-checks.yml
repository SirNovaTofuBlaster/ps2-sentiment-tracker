name: Live checks

# Proves a change to the scraper or its source list against the real sites, from GitHub's
# own servers (which some sites treat differently from a home connection). It runs on pull
# requests only, reads public pages, holds no key and writes nothing.
on:
  pull_request:
    paths:
      - scraper.py
      - feeds.json
      - tools/**
      - .github/workflows/live-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the comparison below needs origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Try the forums and boards
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/try_sources.py forum 4chan

      - name: Old and new scraper on the same live news and Reddit feeds
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/regression_check.py --ref origin/main
