name: Tests

on:
  push:
    branches: [main]
    paths:
      - scraper.py
      - feeds.json
      - index.html
      - retro.css
      - requirements.txt
      - ebay_prices.py
      - ebay_watchlist.json
      - archive.py
      - tools/**
      - tests/**
      - .github/workflows/tests.yml
      - .github/workflows/ebay.yml
      - .github/workflows/live-checks.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js (dashboard checks)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (offline)
        run: python -m unittest discover -s tests -v
