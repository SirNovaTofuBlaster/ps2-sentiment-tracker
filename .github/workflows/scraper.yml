name: PS2 Sentiment Tracker Scraper

# One run of this workflow keeps the scraper going for about five and a half hours
# (scrape_loop.py): it fetches each source type when its interval has passed (feeds.json,
# "poll_every_hours"), commits the new data, asks for the eBay prices job once an hour and then
# starts the next run itself. GitHub starts scheduled runs late or not at all, so the hourly
# schedule is only a backstop: it starts a loop when none is running, and otherwise waits.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "now: fetch every source at once, then keep going. continue: carry on where the last run stopped."
        type: choice
        options: [now, continue]
        default: now
  push:
    # Saving sources (from the dashboard or a commit) or changing the scraper restarts it at once.
    branches: [main]
    paths:
      - feeds.json
      - scraper.py
      - scrape_loop.py

permissions:
  contents: write
  actions: write   # to start the eBay prices job each hour, and this workflow's next run

# One run at a time per branch. A push or "Run scraper now" stops the running loop and starts a
# fresh one that fetches everything; the schedule and a loop's own successor wait for the
# running one. A run started on another branch never stops the loop on main.
concurrency:
  group: scraper-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'continue') }}

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The branch head, not the commit that triggered the run: a run that waited in the
          # concurrency queue must start from the previous run's data commit, or its push conflicts.
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Keep the scraper running
        env:
          # A push or "Run scraper now" fetches every enabled source in its first round.
          FULL_FIRST: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'continue')) && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scrape_loop.py
