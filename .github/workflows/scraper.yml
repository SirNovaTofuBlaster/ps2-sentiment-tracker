name: PS2 Sentiment Tracker Scraper

on:
  schedule:
    # Hourly, at an off-peak minute (top-of-hour runs are the most delayed)
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    # Saving sources (from the dashboard or a commit) or changing the scraper rescrapes right away.
    branches: [main]
    paths:
      - feeds.json
      - scraper.py

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The branch head, not the commit that triggered the run: a run that waited in the
          # concurrency queue must start from the previous run's data commit, or its push conflicts.
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper script
        env:
          # Manual runs and source/scraper changes fetch every enabled feed now instead of
          # waiting for each source type's poll_every_hours slot (see feeds.json).
          FULL_RUN: ${{ github.event_name != 'schedule' && '1' || '' }}
        run: python scraper.py

      - name: Commit and push changes if data updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --staged --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi

          git commit -m "Auto-update sentiment data [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "Push failed after 3 attempts." >&2
          exit 1
