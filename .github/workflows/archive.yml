name: Archive mentions

on:
  schedule:
    - cron: "23 */6 * * *"   # four times a day; the snapshot holds 14 days, so this is ample
  workflow_dispatch:

concurrency:
  group: archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python archive.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          if git diff --staged --quiet; then
            echo "Nothing new to archive."
            exit 0
          fi
          git commit -m "Archive PS2 game mentions"
          # Other jobs save to main too (the scraper, the demand index, eBay prices). If one of
          # them got there first, take its commit and try again instead of failing.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
