name: Demand index

on:
  schedule:
    - cron: "41 5 * * *"   # daily; pageviews only update once a day
  workflow_dispatch:

concurrency:
  group: demand
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python demand.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/demand.json data/wiki_titles.json
          if git diff --staged --quiet; then
            echo "The demand index has not changed."
            exit 0
          fi
          git commit -m "Update demand index"
          # Other jobs save to main too (the scraper, the archive, eBay prices). If one of them
          # got there first, take its commit and try again instead of failing.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
